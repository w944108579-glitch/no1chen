<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>日常请假列表</title>
    <script src="auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
        }
        body {
            width: min(100%, 630px);
            max-width: none;
            margin: 0 auto;
            overflow-x: hidden;
            background: #f2f3f5;
			padding-bottom: calc(min(12.381vw, 96px) + 20px);
        }
        /* 630 × 1260 参考图等比例布局 */
        .nav-bar {
            width: 100%;
            height: 74px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            position: relative;
            z-index: 10;
            border-bottom: 1px solid #e6e6e6;
            display: none;
        }
        .nav-left {
            height: 100%;
            display: flex;
            align-items: center;
            position: relative;
            top: 2px;
        }
        .nav-icon {
            position: relative;
            width: 40px;
            height: 40px;
            color: transparent;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .nav-icon:first-child::before {
            content: "";
            position: absolute;
            left: 16px;
            top: 50%;
            width: 16px;
            height: 16px;
            border-left: 3px solid #111;
            border-bottom: 3px solid #111;
            transform: translateY(-50%) rotate(45deg);
        }
        .nav-icon:nth-child(2) {
            margin-left: 49px;
        }
        .nav-icon:nth-child(2)::before,
        .nav-icon:nth-child(2)::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 29px;
            height: 3px;
            border-radius: 1.5px;
            background: #111;
        }
        .nav-icon:nth-child(2)::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }
        .nav-icon:nth-child(2)::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }
        .nav-title {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 2px);
            color: #050505;
            font-size: 18px;
            line-height: 1;
            font-weight: 500;
            white-space: nowrap;
        }
        .nav-right {
            width: 74px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            position: relative;
            top: 3px;
        }
        .nav-right::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #050505;
            box-shadow: 11px 0 #050505, 22px 0 #050505;
            transform: translateX(-11px);
        }
        #leaveListContainer {
            padding: 0;
        }
        .list-end {
            min-height: min(24vw, 150px);
            padding: min(7vw, 44px) 0;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background: #f2f3f5;
            color: #999;
            font-size: min(3.5vw, 20px);
            line-height: min(4.762vw, 30px);
        }
        .leave-card {
            width: 100%;
            height: min(76.19vw, 480px);
            padding: min(3.968vw, 25px) min(4.127vw, 26px) min(4.444vw, 28px);
            position: relative;
            overflow: hidden;
            margin-bottom: min(2.54vw, 16px);
            background: #fff;
			user-select: none;
			-webkit-user-select: none;
			-webkit-touch-callout: none;
        }
        .leave-card.has-student {
			height: auto;                      /* 高度自适应内容 */
            min-height: min(87.143vw, 549px);
            padding-top: min(5.714vw, 36px);
        }
        .row-item {
            height: min(4.762vw, 30px);
            margin-bottom: min(4.603vw, 29px);
            display: flex;
            align-items: center;
            line-height: min(4.762vw, 30px);
            white-space: nowrap;
			gap: 20px;
        }
        .row-item:last-of-type {
            margin-bottom: min(5.397vw, 34px);
        }
        .leave-card.has-student .row-item:last-of-type {
            margin-bottom: min(5.079vw, 32px);
        }
        .label-text {
            min-width: min(18.254vw, 115px);
            flex-shrink: 0;
            color: #222;
            font-size: min(3.81vw, 23px);
            font-weight: 400;
        }
		.row-item.time-row {
			height: auto; 
			min-height: min(4.762vw, 30px);
			white-space: normal;
			align-items: flex-start;
		}
        .row-item.time-row .label-text {
            white-space: nowrap;
            line-height: min(4.762vw, 30px);
        }
		.row-item.time-row .value-text {
			word-break: normal;
			overflow-wrap: anywhere;
			word-break: break-all; 
			line-height: min(4.762vw, 30px);
		}
        .value-text {
            flex: 1;
            min-width: 0;
            color: #999;
            font-size: min(3.968vw, 22px);
            font-weight: 400;
        }
        .status-text {
            font-size: min(3.968vw, 22px);
        }
        .time-value {
            letter-spacing: max(-.01vw, -.06px);
        }
        .detail-link {
            flex-shrink: 0;
            margin-left: 10px;
            color: #45c7c7;
            font-size: min(3vw, 18px);
            cursor: pointer;
        }
        .btn-teal {
            width: min(30vw, 180px);
            height: min(10vw, 50px);
            margin: 30px auto 20px;
            display: block;
            border: 0;
            border-radius: min(2.222vw, 14px);
            background: linear-gradient(90deg, #27e2d4 0%, #1878e8 100%);
            color: #fff;
            font-size: min(4vw, 20px);
            font-weight: 400;
            cursor: default;
            pointer-events: none;
			display: none;

        }
        .corner-tag-orange,
        .corner-tag-purple {
            position: absolute;
            right: 0;
            bottom: 0;
            width: min(10vw, 60px);
            height: min(10vw, 60px);
            color: #fff;
            font-size: 15px;
            line-height: 1;
            white-space: nowrap;
            pointer-events: none;
            z-index: 2;
        }
		.corner-tag-pending::before {
            background: #ff7a45 !important;
        }
        .corner-tag-orange::before,
        .corner-tag-purple::before {
            content: "";
            position: absolute;
            inset: 0;
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }
        .corner-tag-orange::before {
            background: #ff9a3c;
        }
        .corner-tag-purple::before {
            background: #b77be0;
        }
		.corner-tag-orange span,
        .corner-tag-purple span {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(10vw, 20px);
            height: min(10vw, 20px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
            font-size: min(2.1vw, 14px);
            text-align: center;
            transform: translate(-20%, -25%) rotate(-45deg);
        }
        .corner-tag-orange::after,
        .corner-tag-purple::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-bottom: min(4vw,25px) solid #ffffff;
            border-left: min(4vw,25px) solid transparent;
        }

		.btn-bottom {
			position: fixed;
			bottom: max(8px, env(safe-area-inset-bottom));
			left: 50%;
			transform: translateX(-50%);
			width: min(100%, 630px);
			max-width: none;
			height: min(25vw, 50px);
			border: none;
			border-radius: 0;
			background: linear-gradient(90deg, #27e2d4 0%, #1878e8 100%);
			color: #ffffff;
			font-size: min(4vw, 20px);
			font-weight: 400;
			letter-spacing: 2px;
			cursor: pointer;
			z-index: 100;
			transition: opacity 0.2s;
		}

        .btn-bottom:active {
            opacity: 0.8;
        }
		/* 顶部提示条样式 */
        .alert-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 0;
            background-color: #f7f7f7;
            color: #c03964;
            font-size: min(3.8vw, 15px);
            font-weight: 500;

            z-index: 10;
        }

        .alert-icon {
            width: min(4.5vw, 18px);
            height: min(4.5vw, 18px);
            transform: none;
        }

        /* --- 新增：审批流程时间轴样式 --- */
                /* --- 审批流程时间轴样式 --- */
        .timeline-container {
            margin-top: 0px;
            padding-top: 10px;
            position: relative;
         
			background-color: #f4f5f7; /* 【新增这行】给轨道铺上浅灰底 */
        }

        /* 贯穿上下的竖线 */
        .timeline-container::before {
            content: '';
            position: absolute;
            top: 30px;
            bottom: 20px;
            left: 14px; /* 竖线固定在左侧 14px 处 */
            width: 1px;
            background-color: #dcdcdc;
            z-index: 1;
        }

        .timeline-item {
            position: relative;
            padding-left: 35px; /* 让卡片整体往右退，给左侧的线和点留出位置 */
            margin-bottom: 12px;
        }

        /* 默认圆点（已通过：青色） */
        .timeline-item::before {
            content: '';
            position: absolute;
            top: 20px; /* 与标题文字垂直对齐 */
            left: 14px; /* 先放到和线同一位置 */
            transform: translateX(-50%); /* 再向左偏移自身一半宽度，完美压正线上 */
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #27e2d4;
            border: 2px solid #fff; /* 白色外圈，遮挡底下的竖线 */
            box-sizing: content-box;
            z-index: 2;
        }

        /* 第一个待审批圆点（空心带浅蓝边） */
        .timeline-item:first-child::before {
            background-color: #fff; /* 内部填充白色，这样线就不会透过来 */
            border: 2px solid #5dc2df; 
            width: 8px;
            height: 8px;
            z-index: 2;
        }

        /* 卡片主体 */
        .timeline-content {
            background-color: #fff;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .role {
            font-size: 16px;
            font-weight: 600;
            color: #222;
        }

        .date {
            font-size: 13px;
            color: #999;
        }

        .card-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .comment {
            color: #666;
        }

        .status.success {
            color: #27e2d4;
            font-weight: 700;
        }

        .status.pending {
            color: #ff7a45;
            font-weight: 700;
        }
    </style>
</head>
<body>
	<!-- 顶部提示条 -->
	<div id="alertBanner" class="alert-banner" hidden>
		<svg class="alert-icon" viewBox="0 0 1024 1024" fill="currentColor">
			<path d="M512 960c-35.346 0-64-28.654-64-64h128c0 35.346-28.654 64-64 64z M840 720c0-4.418-3.582-8-8-8H192c-4.418 0-8 3.582-8 8v32c0 4.418 3.582 8 8 8h640c4.418 0 8-3.582 8-8v-32z M725.8 652c-19.2-33.6-31.2-72.8-35.2-113.6L678 180.4C666 96 591.2 32 502 32s-164 64-176 148.4l-12.6 358c-4 40.8-16 80-35.2 113.6H725.8z"></path>
		</svg>
		<span>当前状态不能请假或有请假未完成！</span>
	</div>

    <!-- 请假列表 -->
    <div id="leaveListContainer">
            <div class="list-end">已经到底了哦</div>
    </div>
    <!-- 提交请假按钮 -->
    <button class="btn-bottom" onclick="jumpToSubmitPage()">提交请假</button>

    <script>
		if (!history.state || !history.state.leaveList) {
			history.pushState({ leaveList: true }, '', location.href);
		}
		window.addEventListener('popstate', () => {
			// 关闭当前页面
			window.close();
		});
		 


        window.onload = function(){
            const leaveList = migrateLeaveList();
            renderNewLeaveCards(leaveList);
            applyStaticOverrides();
            applyUserProfile();
            applyDeletedRecords();
            attachLongPressHandlers();
            updateLeaveStatuses(leaveList);
        }

        /**
         * 格式化ISO时间，去除T，输出 2026-08-22 01:00
         */
        function formatIsoTime(isoStr) {
            if (!isoStr) return "";
            return isoStr.replace("T"," ").substring(0,16);
        }

        function normalizeReason(reason){
            if (String(reason) === '1') return '周末外出';
            if (reason === '外出') return '周末外出';
            return reason.replace(/^校外:/, '');
        }

        function formatReason(reason){
            return `校外:${normalizeReason(reason)}`;
        }

        function formatDuration(startTime, endTime){
            const totalHours = Math.floor((new Date(endTime) - new Date(startTime)) / 3600000);
            return `${Math.floor(totalHours / 24)}天${totalHours % 24}小时`;
        }

        function migrateLeaveList(){
            const leaveList = JSON.parse(localStorage.getItem('leaveList')) || [];
            const deletedIds = JSON.parse(localStorage.getItem('deletedLeaveRecordIds')) || [];
            const migrated = leaveList.filter(item => !deletedIds.includes(item.id)).map((item, index) => {
                if (!item.startTime || !item.endTime) {
                    const times = item.time.split(' 至 ');
                    item.startTime = times[0];
                    item.endTime = times[1];
                    item.duration = item.long;
                    delete item.time;
                    delete item.long;
                }
                if (!item.id) item.id = `leave-${item.startTime}-${index}`;
                item.duration = formatDuration(item.startTime, item.endTime);
                item.reason = normalizeReason(item.reason);
                return item;
            });
            localStorage.setItem('leaveList', JSON.stringify(migrated));
            return migrated;
        }

        function applyDeletedRecords(){
            const deletedIds = JSON.parse(localStorage.getItem('deletedLeaveRecordIds')) || [];
            document.querySelectorAll('.leave-card').forEach(card => {
                if (deletedIds.includes(card.dataset.recordId)) card.closest('.card-wrapper').remove();
            });
        }

        function attachLongPressHandlers(){
            document.querySelectorAll('.leave-card').forEach(card => {
                let timer;
                const cancel = () => { clearTimeout(timer); timer = undefined; };
                card.addEventListener('pointerdown', () => {
                    timer = setTimeout(() => {
                        const deletedIds = JSON.parse(localStorage.getItem('deletedLeaveRecordIds')) || [];
                        if (!deletedIds.includes(card.dataset.recordId)) deletedIds.push(card.dataset.recordId);
                        localStorage.setItem('deletedLeaveRecordIds', JSON.stringify(deletedIds));
                        const leaveList = JSON.parse(localStorage.getItem('leaveList')) || [];
                        localStorage.setItem('leaveList', JSON.stringify(leaveList.filter(item => item.id !== card.dataset.recordId)));
                        card.closest('.card-wrapper').remove();
                        timer = undefined;
                    }, 3000);
                });
                ['pointerup', 'pointercancel', 'pointerleave'].forEach(event => card.addEventListener(event, cancel));
                card.addEventListener('contextmenu', event => event.preventDefault());
            });
        }

                function renderNewLeaveCards(leaveList){
            const container = document.getElementById('leaveListContainer');
            const alertBanner = document.getElementById('alertBanner');
            const mockList = [];
            const reasons = ['实习实践', '事假', '病假', '回家', '周末外出'];
            for (let i = 1; i <= 5; i++) {
                const pastDate = new Date();
                pastDate.setDate(pastDate.getDate() - (i * 2)); // 往前推 2, 4, 6 天
                const endDate = new Date(pastDate);
                endDate.setHours(endDate.getHours() + 4 + i); // 请假时长
                
                mockList.push({
                    id: 'mock-' + i,
                    startTime: pastDate.toISOString(), // 保持标准 ISO 格式
                    endTime: endDate.toISOString(),
                    reason: reasons[Math.floor(Math.random() * reasons.length)],
                    status: '已销假', // 历史卡片全部设为已销假
                    duration: `${Math.floor(i/2)}天${4+i}小时`
                });
            }
            // 请假记录按提交顺序保存，新提交的记录始终排在第一张；模拟记录固定排在其后。
            const fullList = [...leaveList, ...mockList];
            const hasTimeline = leaveList.length > 0
                && normalizeReason(leaveList[0].reason) === '实习实践';
            alertBanner.hidden = !hasTimeline;

            const cardsHtml = fullList.map((item, index) => {
                const showTime = formatIsoTime(item.startTime) + "至" + formatIsoTime(item.endTime);
                const durationStr = item.duration || formatDuration(item.startTime, item.endTime);
                
                // 只有最新一条真实记录且原因为“实习实践”时显示审批时间线。
                const isLatest = index === 0 && hasTimeline;
                
                let timelineHtml = '';
                let ribbonHtml = '';

                if (isLatest) {
                
                    timelineHtml = `
                    <div class="timeline-container">
                        <!-- 内部的时间轴节点代码保持原样 -->
                        <div class="timeline-item">
                            <div class="timeline-content">
                                <div class="card-header">
                                    <span class="role">分管校领导</span>
                                </div>
                                <div class="card-body">
                                    <span class="comment">意见：</span>
                                    <span class="status pending">待审批</span>
                                </div>
                            </div>
                        </div>
                        <div class="timeline-item">
                            <div class="timeline-content">
                                <div class="card-header">
                                    <span class="role">学院</span>
                                    <span class="date">2026-11-04</span>
                                </div>
                                <div class="card-body">
                                    <span class="comment">意见：同意</span>
                                    <span class="status success">已通过</span>
                                </div>
                            </div>
                        </div>
                        <div class="timeline-item">
                            <div class="timeline-content">
                                <div class="card-header">
                                    <span class="role">大队长</span>
                                    <span class="date">2026-11-04</span>
                                </div>
                                <div class="card-body">
                                    <span class="comment">意见：同意</span>
                                    <span class="status success">已通过</span>
                                </div>
                            </div>
                        </div>
                        <div class="timeline-item">
                            <div class="timeline-content">
                                <div class="card-header">
                                    <span class="role">学管干部</span>
                                    <span class="date">2026-11-03</span>
                                </div>
                                <div class="card-body">
                                    <span class="comment">意见：同意</span>
                                    <span class="status success">已通过</span>
                                </div>
                            </div>
                        </div>
                        <div class="timeline-item">
                            <div class="timeline-content">
                                <div class="card-header">
                                    <span class="role">学生申请</span>
                                    <span class="date">2026-11-03</span>
                                </div>
                                <div class="card-body">
                                    <span class="comment">${window.siteProfile?.name || '无'}(${window.siteProfile?.studentId || '无'})发起申请</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    `;
                }

                // 生成大卡片
                return `
                <div class="card-wrapper">
                    <div class="leave-card has-student" data-record-id="${item.id}" data-start-time="${item.startTime}">
                        ${ribbonHtml}
                        <!-- 第一张真实请假卡片显示审批中角标 -->
                        ${isLatest
                            ? `<div class="corner-tag-orange corner-tag-pending"><span>审批中</span></div>` 
                            : item.status === '已销假'
                                ? `<div class="corner-tag-purple"><span>已销假</span></div>`
                                : `<div class="corner-tag-orange"><span>${item.status || '待销假'}</span></div>`
                        }
                        <div class="row-item">
                            <span class="label-text">学号</span>
                            <span class="value-text">2025903066</span>
                            <span class="detail-link" onclick="showDetail(this.closest('.leave-card'))">查看详情 ›</span>
                        </div>
                        <div class="row-item">
                            <span class="label-text">姓名</span>
                            <span class="value-text">王贺</span>
                        </div>
                        <div class="row-item time-row">
                            <span class="label-text">请假时间</span>
                            <span class="value-text time-value">${showTime}</span>
                        </div>
                        <div class="row-item">
                            <span class="label-text">请假时长</span>
                            <span class="value-text">${durationStr}</span>
                        </div>
                        <div class="row-item">
                            <span class="label-text">是否续假</span>
                            <span class="value-text">否</span>
                        </div>
                        <div class="row-item">
                            <span class="label-text">请假原因</span>
                            <span class="value-text">${formatReason(item.reason)}</span>
                        </div>
                        <div class="row-item">
                            <span class="label-text">销假状态</span>
                            <span class="value-text status-text">${item.status}</span>
                        </div>
                    </div>
                    ${timelineHtml}
                </div>
                `;
            }).join('');
            container.insertAdjacentHTML('afterbegin', cardsHtml);
        }

        function applyStaticOverrides(){
            const overrides = JSON.parse(localStorage.getItem('leaveRecordOverrides')) || {};
            Object.entries(overrides).forEach(([recordId, record]) => {
                const card = document.querySelector(`[data-record-id="${recordId}"]`);
                if (!card) return;
                card.dataset.startTime = record.startTime;
                const values = {
                    '请假时间': formatIsoTime(record.startTime) + '至' + formatIsoTime(record.endTime),
                    '请假时长': formatDuration(record.startTime, record.endTime),
                    '请假原因': formatReason(record.reason)
                };
                card.querySelectorAll('.row-item').forEach(row => {
                    const label = row.querySelector('.label-text');
                    const value = row.querySelector('.value-text');
                    if (label && value && values[label.textContent] !== undefined) {
                        value.textContent = values[label.textContent];
                    }
                });
            });
        }

        function applyUserProfile(){
            document.querySelectorAll('.leave-card .row-item').forEach(row => {
                const label = row.querySelector('.label-text');
                const value = row.querySelector('.value-text');
                if (!label || !value) return;
                if (label.textContent === '姓名') value.textContent = window.siteProfile.name;
                if (label.textContent === '学号') value.textContent = window.siteProfile.studentId;
            });
        }

        function updateLeaveStatuses(leaveList){
            const cards = Array.from(document.querySelectorAll('.leave-card'));
            const latestCard = cards.find(card => !card.dataset.recordId.startsWith('mock-'));
            const statusOverrides = JSON.parse(localStorage.getItem('leaveStatusOverrides')) || {};
            let hasPending = false;

            cards.forEach(card => {
                if (card.dataset.recordId.startsWith('mock-')) return;
                const isLatest = card === latestCard;
                const savedStatus = statusOverrides[card.dataset.recordId];
                const status = isLatest && savedStatus !== '已销假' ? '待销假' : '已销假';
                if (status === '待销假') hasPending = true;
                const tag = card.querySelector('[class^="corner-tag-"]');
				if (tag.classList.contains('corner-tag-pending')) {
					// 如果已经是审批中样式，就保持“审批中”不覆盖
					tag.querySelector('span').textContent = '审批中';
				} else {
					tag.className = status === '待销假' ? 'corner-tag-orange' : 'corner-tag-purple';
					tag.querySelector('span').textContent = status;
				}
                const statusRow = Array.from(card.querySelectorAll('.row-item')).find(row =>
                    row.querySelector('.label-text').textContent === '销假状态'
                );
                statusRow.querySelector('.value-text').textContent = status;
                statusOverrides[card.dataset.recordId] = status;
            });
            document.querySelector('.btn-bottom').textContent = hasPending ? '提交请假' : '提交请假';
            localStorage.setItem('leaveStatusOverrides', JSON.stringify(statusOverrides));

            leaveList.forEach(item => {
                const card = document.querySelector(`[data-record-id="${item.id}"]`);
                if(!card) return;
                const statusRow = Array.from(card.querySelectorAll('.row-item')).find(row =>
                    row.querySelector('.label-text').textContent === '销假状态'
                );
                if(statusRow) {
                    item.status = statusRow.querySelector('.value-text').textContent;
                }
            });
            localStorage.setItem('leaveList', JSON.stringify(leaveList));
        }
        function showDetail(card) {
            const values = {};
            card.querySelectorAll('.row-item').forEach(row => {
                const label = row.querySelector('.label-text');
                const value = row.querySelector('.value-text');
                if (label && value) values[label.textContent] = value.textContent;
            });
            const detail = JSON.parse(localStorage.getItem(`leaveDetail:${card.dataset.recordId}`) || '{}');
            localStorage.setItem('selectedLeaveRecord', JSON.stringify({
                id: card.dataset.recordId,
                leaveTime: values['请假时间'],
                total: values['请假时长'],
                reason: normalizeReason(values['请假原因']),
                leaveType: detail.leaveType || '校外',
                description: detail.description || '',
                status: values['销假状态']
            }));
            window.location.replace("leave-detail.html");
        }
        function jumpToSubmitPage() {
            localStorage.setItem('selectedLeaveRecord', JSON.stringify({
                id: 'leave-' + Date.now(),
                isNew: true,
                leaveTime: '',
                total: '',
                reason: '',
                status: '待销假'
            }));
            window.location.replace("leave-detail.html");
        }
    </script>
</body>
</html>
